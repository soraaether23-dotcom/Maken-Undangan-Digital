<script>
(function(){
'use strict';
const STORAGE_KEY='makenInvitationStudio_v1';
const allowedSections=['hero','couple','story','event','countdown','location','gallery','music','rsvp','guestbook','gift','dresscode','hosts','closing'];
const templates=[
 {id:'magazine',name:'Modern Magazine',desc:'Layout editorial, foto besar, tipografi modern, dan komposisi asimetris.',category:'Modern',colors:['#242036','#8e496a','#e7c68f','#fbf5f0'],tags:['Editorial','Modern'],design:{primary:'#242036',secondary:'#8e496a',accent:'#e7c68f',background:'#fbf5f0',text:'#302a35',cover:'editorial',headingFont:'Georgia',bodyFont:'Arial',style:'Modern Magazine'}},
 {id:'buol',name:'Adat Buol Royal',desc:'Hitam, emas, marun, dan ornamen formal yang terinspirasi nuansa adat.',category:'Adat Nusantara',colors:['#17151a','#702b3a','#d4af65','#f7f1e9'],tags:['Adat','Luxury'],design:{primary:'#17151a',secondary:'#702b3a',accent:'#d4af65',background:'#f7f1e9',text:'#292328',cover:'envelope',headingFont:'Georgia',bodyFont:'Arial',style:'Adat Buol Royal'}},
 {id:'korean',name:'Korean Minimalist',desc:'Ivory, beige, ruang kosong, garis halus, dan komposisi ringan.',category:'Minimal',colors:['#ece2d8','#b9a496','#9e887b','#fffaf4'],tags:['Minimal','Soft'],design:{primary:'#8a706b',secondary:'#cbb4aa',accent:'#b18d74',background:'#fffaf4',text:'#433b39',cover:'minimal',headingFont:'Georgia',bodyFont:'Arial',style:'Korean Minimalist'}},
 {id:'floral',name:'Floral Romantic',desc:'Pink dan kuning lembut, bunga, tekstur kertas, dan nuansa romantis.',category:'Romantic',colors:['#9c536d','#e6a8bc','#eac76b','#fff8f3'],tags:['Floral','Romantic'],design:{primary:'#9c536d',secondary:'#e6a8bc',accent:'#eac76b',background:'#fff8f3',text:'#533c46',cover:'floral',headingFont:'Georgia',bodyFont:'Arial',style:'Floral Romantic'}},
 {id:'luxury',name:'Luxury Classic',desc:'Nuansa gelap, gold foil, proporsi klasik, dan detail premium.',category:'Luxury',colors:['#18171b','#6d293a','#c8a45d','#f6f0e5'],tags:['Luxury','Classic'],design:{primary:'#18171b',secondary:'#6d293a',accent:'#c8a45d',background:'#f6f0e5',text:'#30282a',cover:'classic',headingFont:'Georgia',bodyFont:'Arial',style:'Luxury Classic'}},
 {id:'pinkyellow',name:'Pink & Yellow Editorial',desc:'Warna cerah, tekstur ringan, blok warna, dan layout foto editorial.',category:'Bright',colors:['#df7398','#f2c94c','#fff5de','#51364c'],tags:['Bright','Editorial'],design:{primary:'#df7398',secondary:'#f2c94c',accent:'#f2c94c',background:'#fff5de',text:'#51364c',cover:'editorial',headingFont:'Georgia',bodyFont:'Arial',style:'Pink & Yellow Editorial'}}
];
const defaultState={projects:[],currentProjectId:null,guests:[],settings:{companyName:'Maken Group',appName:'Maken Invitation Studio',aiEndpoint:'',whatsappNumber:'',defaultStyle:'Modern Magazine',githubRepoUrl:'',notes:'',autoSave:true}};
let state=loadState();let currentPage='dashboard';let currentEditorTab='data';let projectSearch='';let guestSearch='';let templateFilter='Semua';let latestPrompt='';let toastTimer=null;
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(s&&Array.isArray(s.projects))return {...structuredClone(defaultState),...s,settings:{...defaultState.settings,...(s.settings||{})}}}catch(e){}return structuredClone(defaultState)}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true}catch(e){toast('Penyimpanan browser hampir penuh. Ekspor cadangan dan kecilkan ukuran foto.', 'error');return false}}
function uid(){return 'mk_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeColor(v,fb){return /^#[0-9a-fA-F]{6}$/.test(v||'')?v:fb}
function getProject(id=state.currentProjectId){return state.projects.find(p=>p.id===id)||null}
function getTemplate(id){return templates.find(t=>t.id===id)||templates[0]}
function dateNow(){return new Date().toISOString()}
function normalizeHosts(project){if(!project)return[];if(Array.isArray(project.hosts)){project.hosts=project.hosts.map(x=>String(x??''));if(!project.hosts.length)project.hosts=[''];return project.hosts}const legacy=String(project.hosts??'').trim();project.hosts=legacy?legacy.split(/\r?\n/).map(x=>x.trim()).filter(Boolean):[''];return project.hosts}
function newProject(templateId='magazine'){
 const t=getTemplate(templateId);const p={id:uid(),title:'Undangan Baru',eventType:'Pernikahan',slug:'undangan-'+Math.random().toString(36).slice(2,7),status:'Draf',createdAt:dateNow(),updatedAt:dateNow(),templateId:t.id,couple:{bride:'Nama Mempelai Wanita',groom:'Nama Mempelai Pria',brideNickname:'',groomNickname:'',brideParents:'',groomParents:'',contactWhatsApp:''},event:{akadDate:'',akadTime:'',akadVenue:'',akadAddress:'',receptionDate:'',receptionTime:'',receptionVenue:'',receptionAddress:'',mapsUrl:'',timezone:'Asia/Makassar'},copy:{opening:'Dengan penuh rasa syukur, kami mengundang Bapak/Ibu/Saudara/i untuk hadir di hari bahagia kami.',quote:'Dan di antara tanda-tanda kekuasaan-Nya ialah Dia menciptakan untukmu pasangan hidup dari jenismu sendiri agar kamu merasa tenteram di sampingnya.',story:'',closing:'Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.'},design:{...t.design},features:{countdown:true,maps:true,rsvp:true,guestbook:true,music:false,gift:false,dresscode:false,story:false,gallery:true,hosts:true},media:{coverPhoto:'',gallery:[],musicUrl:''},hosts:['Keluarga besar kedua mempelai'],gift:{bank:'',account:'',recipient:''},dresscode:'',guests:[]};state.projects.unshift(p);state.currentProjectId=p.id;saveState();return p;
}
function toast(msg,type=''){const wrap=document.getElementById('toastWrap');const d=document.createElement('div');d.className='toast '+type;d.textContent=msg;wrap.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transform='translateY(5px)';setTimeout(()=>d.remove(),220)},3600)}
function fmtDate(s){if(!s)return 'Belum ditentukan';try{return new Date(s+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}catch(e){return s}}
function statusBadge(status){let c=status==='Diterbitkan'?'green':status==='Siap Diterbitkan'?'purple':status==='Perlu Pembaruan'?'amber':status==='Diarsipkan'?'':'amber';return `<span class="badge ${c}">${esc(status||'Draf')}</span>`}
function setPage(page){currentPage=page;document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show');renderPage();window.scrollTo({top:0,behavior:'smooth'})}
function pageTitle(){return ({dashboard:'Dashboard',editor:'Editor Undangan',projects:'Undangan Saya',templates:'Galeri Template',guests:'Manajemen Tamu',ai:'AI Design Lab',publish:'Publikasi & Tautan',analytics:'Statistik RSVP',settings:'Pengaturan'})[currentPage]||'Maken Invitation Studio'}
function renderPage(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));document.getElementById('topCrumb').innerHTML=`${esc(pageTitle())}<small>Maken Invitation Studio · Maken Group</small>`;const root=document.getElementById('pageContent');const pages={dashboard:renderDashboard,editor:renderEditor,projects:renderProjects,templates:renderTemplates,guests:renderGuests,ai:renderAI,publish:renderPublish,analytics:renderAnalytics,settings:renderSettings};root.innerHTML=(pages[currentPage]||renderDashboard)();bindPageEvents();}
function pageHead(eyebrow,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="inline-actions">${actions}</div>`:''}</div>`}
function stat(label,val,icon,hint,color=''){return `<div class="card stat"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon" ${color?`style="background:${color}18;color:${color}"`:''}>${icon}</span></div><div class="stat-value">${val}</div><div class="stat-hint">${hint}</div></div>`}
function projectThumb(p){let d=p.design||getTemplate(p.templateId).design;return `<div class="project-thumb" style="background:linear-gradient(145deg,${safeColor(d.primary,'#242036')},${safeColor(d.secondary,'#8e496a')});border:1px solid ${safeColor(d.accent,'#e7c68f')}44">${esc((p.couple?.groom||'M').split(' ')[0])}<br><span style="color:${safeColor(d.accent,'#e7c68f')}">&amp;</span><br>${esc((p.couple?.bride||'K').split(' ')[0])}</div>`}
function projectRow(p,actions=true){return `<div class="project-row">${projectThumb(p)}<div class="project-info"><strong>${esc(p.title||`${p.couple?.groom||'Mempelai'} & ${p.couple?.bride||'Mempelai'}`)}</strong><p>${esc(p.design?.style||p.templateId)} · Diperbarui ${new Date(p.updatedAt||p.createdAt).toLocaleDateString('id-ID')}</p>${statusBadge(p.status)}</div>${actions?`<div class="project-actions"><button class="btn small" data-action="edit-project" data-id="${p.id}">Buka</button><button class="btn small ghost" title="Lainnya" data-action="project-menu" data-id="${p.id}">•••</button></div>`:''}</div>`}
function renderDashboard(){const projects=state.projects;const published=projects.filter(p=>p.status==='Diterbitkan').length;const drafts=projects.filter(p=>p.status!=='Diterbitkan'&&p.status!=='Diarsipkan').length;const guests=state.guests.length;const recent=projects.slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,4);return `${pageHead('MAKEN GROUP · CREATIVE WORKSPACE','Semua cerita bahagia, <span style="color:var(--purple)">dimulai di sini.</span>','Kelola proyek undangan, rancang desain baru, dan siapkan tautan untuk dibagikan.')}
<div class="card welcome"><div class="welcome-inner"><div><div class="eyebrow" style="color:#cabfff">YOUR CREATIVE WORKSPACE</div><h2>Selamat datang di Maken Invitation Studio ✦</h2><p>Ubah ide menjadi undangan digital yang personal. Mulai dari template, desain sendiri, atau minta bantuan AI untuk mengeksplorasi konsep baru.</p><button class="btn" data-action="new-project">＋ Buat undangan pertama</button></div><div class="welcome-stat"><strong>${projects.length.toString().padStart(2,'0')}</strong><span>Proyek undangan</span></div></div></div>
<div class="stats">${stat('Total Proyek',projects.length,'▧','Semua proyek undangan')}${stat('Draf Aktif',drafts,'✎','Belum selesai diterbitkan','#ac7618')}${stat('Diterbitkan',published,'↗','Proyek berstatus publik','#16876b')}${stat('Daftar Tamu',guests,'♧','Tamu tersimpan di browser','#e18bac')}</div>
<div class="dashboard-grid"><section class="card card-pad"><div class="card-head"><div><h2>Proyek terbaru</h2><div class="small-text muted" style="margin-top:5px">Lanjutkan dari pekerjaan terakhirmu</div></div><button class="btn small" data-page="projects">Lihat semua ↗</button></div>${recent.length?`<div class="project-list">${recent.map(p=>projectRow(p)).join('')}</div>`:`<div class="empty"><div class="empty-icon">✧</div><h3>Ruang kreatifmu masih kosong</h3><p>Buat undangan pertama. Kamu bisa memulai dari template atau langsung merancang konsep sendiri.</p><button class="btn primary" data-action="new-project">＋ Buat Undangan Baru</button></div>`}</section><section class="card card-pad"><div class="card-head"><div><h2>Akses cepat</h2><div class="small-text muted" style="margin-top:5px">Langsung menuju alat yang dibutuhkan</div></div></div><div class="quick-grid"><button class="quick" data-action="new-project"><span class="qi">✦</span><strong>Buat Undangan</strong><span>Mulai proyek dari awal.</span></button><button class="quick" data-page="templates"><span class="qi">▦</span><strong>Jelajahi Template</strong><span>Pilih gaya visual baru.</span></button><button class="quick" data-page="ai"><span class="qi">✧</span><strong>AI Design Lab</strong><span>Ubah prompt menjadi konsep.</span></button><button class="quick" data-page="publish"><span class="qi">↗</span><strong>Publikasi</strong><span>Ekspor dan siapkan tautan.</span></button></div><div class="divider"></div><div class="notice neutral"><span>ⓘ</span><div><strong>Mode penyimpanan lokal</strong><br>Proyek disimpan di browser ini. Gunakan Cadangkan Data untuk mengekspor JSON secara berkala.</div></div></section></div><div class="footnote">© ${new Date().getFullYear()} Maken Group · Maken Invitation Studio</div>`}
function renderProjects(){let projects=state.projects.filter(p=>(`${p.title} ${p.couple?.bride} ${p.couple?.groom} ${p.status}`).toLowerCase().includes(projectSearch.toLowerCase()));return `${pageHead('PROJECT LIBRARY','Undangan Saya','Kelola semua draf dan proyek yang pernah dibuat. Duplikasi desain untuk memulai undangan baru dengan lebih cepat.',`<button class="btn primary" data-action="new-project">＋ Buat Proyek</button>`)}<div class="toolbar"><input class="input" id="projectSearch" placeholder="Cari nama proyek atau mempelai..." value="${esc(projectSearch)}"><select class="select" id="projectStatusFilter" style="max-width:190px"><option>Semua Status</option><option>Draf</option><option>Siap Diterbitkan</option><option>Diterbitkan</option><option>Diarsipkan</option></select><button class="btn" data-action="backup">⇩ Ekspor Semua</button></div><div class="card card-pad">${projects.length?`<div class="project-list">${projects.filter(p=>{let f=document.getElementById('projectStatusFilter')?.value||'Semua Status';return f==='Semua Status'||p.status===f}).map(p=>projectRow(p)).join('')||'<div class="empty"><p>Tidak ada proyek yang cocok.</p></div>'}</div>`:`<div class="empty"><div class="empty-icon">▧</div><h3>Belum ada proyek</h3><p>Mulai dengan undangan kosong, atau pilih salah satu template Maken Group.</p><button class="btn primary" data-action="new-project">Buat Undangan</button> <button class="btn" data-page="templates">Lihat Template</button></div>`}</div>`}
function templateCard(t){return `<div class="card template-card"><div class="template-art" style="color:${t.colors[3]};background:linear-gradient(145deg,${t.colors[0]},${t.colors[1]})"><div class="art-content"><div class="art-kicker">THE WEDDING OF</div><div class="art-names">Fadli<br><span style="color:${t.colors[2]}">&amp;</span><br>Mawar</div><div class="art-date">SAVE THE DATE</div></div></div><div class="template-meta"><div class="tag-row">${t.tags.map(tag=>`<span class="badge">${tag}</span>`).join('')}</div><h3 style="margin-top:10px">${t.name}</h3><p>${t.desc}</p><div class="template-bottom"><span class="small-text muted">${t.category}</span><button class="btn primary small" data-action="use-template" data-id="${t.id}">Gunakan template →</button></div></div></div>`}
function renderTemplates(){return `${pageHead('DESIGN LIBRARY','Galeri Template','Temukan arah visual. Setiap template menjadi titik awal yang dapat diubah lewat editor atau AI Design Lab.',`<button class="btn" data-page="ai">✧ Rancang dengan AI</button>`)}<div class="toolbar"><input class="input" id="templateSearch" placeholder="Cari nama atau gaya template..." value=""><select class="select" id="templateCategory" style="max-width:190px"><option>Semua</option><option>Modern</option><option>Adat Nusantara</option><option>Minimal</option><option>Romantic</option><option>Luxury</option><option>Bright</option></select></div><div class="template-grid" id="templateGrid">${templates.map(templateCard).join('')}</div><div class="footnote">Template dapat dikembangkan dengan palet, font, media, dan komponen tambahan.</div>`}
function inputField(label,path,value,placeholder='',type='text',help=''){return `<div class="field"><label class="label">${label}</label><input class="input" type="${type}" data-path="${path}" value="${esc(value||'')}" placeholder="${esc(placeholder)}">${help?`<div class="field-help">${help}</div>`:''}</div>`}
function textareaField(label,path,value,placeholder='',help=''){return `<div class="field"><label class="label">${label}</label><textarea class="textarea" data-path="${path}" placeholder="${esc(placeholder)}">${esc(value||'')}</textarea>${help?`<div class="field-help">${help}</div>`:''}</div>`}
function renderEditor(){const p=getProject();if(!p)return pageHead('EDITOR','Buat undangan pertamamu','Pilih template sebagai dasar, kemudian lengkapi data mempelai dan detail acara.','<button class="btn" data-page="templates">Lihat Template</button>');const d=p.design||getTemplate(p.templateId).design;return `${pageHead('INVITATION BUILDER','Editor Undangan','Atur konten, desain, dan fitur undangan. Pratinjau akan mengikuti data yang kamu ubah.',`<button class="btn" data-action="save-project">✓ Simpan</button><button class="btn primary" data-page="publish">Siapkan Publikasi ↗</button>`)}<div class="editor-toolbar"><div class="editor-tabs"><button class="${currentEditorTab==='data'?'active':''}" data-editor-tab="data">01 · Data</button><button class="${currentEditorTab==='design'?'active':''}" data-editor-tab="design">02 · Desain</button><button class="${currentEditorTab==='content'?'active':''}" data-editor-tab="content">03 · Konten</button><button class="${currentEditorTab==='features'?'active':''}" data-editor-tab="features">04 · Fitur</button></div><div class="inline-actions"><span class="badge green" id="saveState">● Tersimpan lokal</span><button class="btn small" data-page="ai">✧ Minta AI revisi</button></div></div><div class="editor-layout"><div class="editor-stack" id="editorForm">${renderEditorFields(p,currentEditorTab)}</div><div class="preview-sticky"><div class="card card-pad"><div class="card-head"><div><h3>Live Preview</h3><div class="small-text muted" style="margin-top:4px">Simulasi tampilan mobile</div></div><button class="btn small" data-action="refresh-preview">⟳</button></div><div class="preview-outer"><div class="preview-device"><div class="preview-inner" id="livePreview">${renderMiniPreview(p)}</div></div></div><div class="inline-actions" style="justify-content:center;margin-top:13px"><button class="btn small" data-action="preview-full">Lihat pratinjau penuh</button><button class="btn small" data-action="export-html">Unduh HTML</button></div></div><div class="notice neutral" style="margin-top:12px"><span>ⓘ</span><div>Perubahan otomatis disimpan secara lokal pada browser ini. Ekspor cadangan sebelum membersihkan data browser.</div></div></div></div>`}
function renderEditorFields(p,tab){const c=p.couple||{},e=p.event||{},cp=p.copy||{},d=p.design||{},m=p.media||{},f=p.features||{};if(tab==='data')return `<section class="card editor-card"><div class="card-head"><h3>Identitas Proyek</h3>${statusBadge(p.status)}</div><div class="form-grid">${inputField('Nama proyek','title',p.title,'Contoh: Fadli & Mawar')}${inputField('Slug undangan','slug',p.slug,'fadli-mawar') }<div class="field"><label class="label">Jenis acara</label><select class="select" data-path="eventType">${['Pernikahan','Pertunangan','Aqiqah atau khitanan','Ulang tahun','Acara keluarga','Lainnya'].map(x=>`<option ${p.eventType===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label">Status proyek</label><select class="select" data-path="status">${['Draf','Siap Diterbitkan','Diterbitkan','Perlu Pembaruan','Diarsipkan'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div></section><section class="card editor-card"><div class="card-head"><h3>Data Kedua Mempelai</h3><span class="badge">Wajib diperiksa</span></div><div class="form-grid">${inputField('Nama mempelai pria','couple.groom',c.groom,'Nama lengkap mempelai pria')}${inputField('Nama mempelai wanita','couple.bride',c.bride,'Nama lengkap mempelai wanita')}${inputField('Nama panggilan pria','couple.groomNickname',c.groomNickname,'Nama panggilan (opsional)')}${inputField('Nama panggilan wanita','couple.brideNickname',c.brideNickname,'Nama panggilan (opsional)')}${inputField('Nama orang tua mempelai pria','couple.groomParents',c.groomParents,'Putra dari ...','text')}${inputField('Nama orang tua mempelai wanita','couple.brideParents',c.brideParents,'Putri dari ...','text')}${inputField('Nomor WhatsApp RSVP (opsional)','couple.contactWhatsApp',c.contactWhatsApp,'62812xxxxxxx','tel','Gunakan kode negara tanpa tanda +. Nomor ini dapat disertakan pada ekspor undangan.')}</div></section><section class="card editor-card"><div class="card-head"><div class="host-card-intro"><h3>Turut Mengundang</h3><p class="small-text muted">Tambahkan keluarga, tokoh, atau pihak yang turut mengundang. Kolom dapat ditambah atau dihapus sesuai kebutuhan.</p></div><button class="btn small primary" data-action="add-host">＋ Tambah Kolom</button></div><div class="host-editor-list">${normalizeHosts(p).map((host,i)=>`<div class="host-row"><div class="field"><label class="label" for="hostField${i}">Pihak / Nama ${i+1}</label><input id="hostField${i}" class="input" data-host-index="${i}" value="${esc(host)}" placeholder="Contoh: Keluarga besar mempelai pria"></div><button type="button" class="btn small danger" data-action="remove-host" data-id="${i}" ${normalizeHosts(p).length===1?'disabled title="Minimal satu kolom tersedia"':''}>Hapus</button></div>`).join('')}</div><div class="field-help">Setiap kolom akan tampil sebagai baris tersendiri pada bagian Turut Mengundang di undangan final. Kolom kosong tidak akan ditampilkan.</div></section><section class="card editor-card"><div class="card-head"><h3>Akad / Acara Pertama</h3><span class="badge">Opsional</span></div><div class="form-grid">${inputField('Tanggal','event.akadDate',e.akadDate,'','date')}${inputField('Waktu','event.akadTime',e.akadTime,'','time')}${inputField('Nama tempat','event.akadVenue',e.akadVenue,'Nama masjid / gedung')}${inputField('Alamat','event.akadAddress',e.akadAddress,'Alamat lengkap') }</div></section><section class="card editor-card"><div class="card-head"><h3>Resepsi / Acara Kedua</h3><span class="badge">Opsional</span></div><div class="form-grid">${inputField('Tanggal','event.receptionDate',e.receptionDate,'','date')}${inputField('Waktu','event.receptionTime',e.receptionTime,'','time')}${inputField('Nama tempat','event.receptionVenue',e.receptionVenue,'Nama gedung / lokasi')}${inputField('Alamat','event.receptionAddress',e.receptionAddress,'Alamat lengkap')}${inputField('Tautan Google Maps','event.mapsUrl',e.mapsUrl,'https://maps.google.com/...','url','Gunakan URL https yang valid.') }<div class="field"><label class="label">Zona waktu</label><select class="select" data-path="event.timezone">${['Asia/Makassar','Asia/Jakarta','Asia/Jayapura','Asia/Singapore','UTC'].map(x=>`<option ${e.timezone===x?'selected':''}>${x}</option>`).join('')}</select></div></div></section>`;
 if(tab==='design')return `<section class="card editor-card"><div class="card-head"><h3>Pilih Template Dasar</h3><button class="btn small" data-page="templates">Jelajahi semua</button></div><div class="form-grid"><div class="field span-2"><label class="label">Template aktif</label><select class="select" id="editorTemplate">${templates.map(t=>`<option value="${t.id}" ${p.templateId===t.id?'selected':''}>${t.name}</option>`).join('')}</select><div class="field-help">Mengganti template akan mengganti token warna dan gaya dasar, bukan data acara.</div></div>${[['Warna utama','design.primary',d.primary||'#171827'],['Warna sekunder','design.secondary',d.secondary||'#782b47'],['Warna aksen','design.accent',d.accent||'#d4af65'],['Warna latar','design.background',d.background||'#faf5f0'],['Warna teks','design.text',d.text||'#31242a']].map(([label,path,val])=>`<div class="field"><label class="label">${label}</label><div style="display:flex;gap:8px;align-items:center"><input type="color" class="input" data-path="${path}" value="${safeColor(val,'#777777')}" style="padding:4px;height:42px;width:58px"><input class="input" data-path="${path}" value="${esc(safeColor(val,'#777777'))}" maxlength="7" style="font-family:monospace"></div></div>`).join('')}<div class="field"><label class="label">Gaya desain</label><input class="input" data-path="design.style" value="${esc(d.style||'Custom')}" placeholder="Nama gaya desain"></div><div class="field"><label class="label">Gaya sampul</label><select class="select" data-path="design.cover">${[['envelope','Amplop interaktif'],['editorial','Editorial foto penuh'],['minimal','Minimalis'],['floral','Floral'],['classic','Klasik']].map(([v,l])=>`<option value="${v}" ${d.cover===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label class="label">Font judul</label><select class="select" data-path="design.headingFont">${['Georgia','Palatino Linotype','Times New Roman','Arial','Trebuchet MS'].map(x=>`<option ${d.headingFont===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label">Font isi</label><select class="select" data-path="design.bodyFont">${['Arial','Georgia','Verdana','Trebuchet MS','Tahoma'].map(x=>`<option ${d.bodyFont===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="divider"></div><div class="label">Preset palet cepat</div><div class="swatches">${templates.map(t=>`<button class="swatch" data-action="apply-palette" data-id="${t.id}"><span class="swatch-dot" style="background:${t.colors[0]}"></span>${t.name}</button>`).join('')}</div></section><section class="card editor-card"><div class="card-head"><h3>Foto dan Media</h3><span class="badge">Disimpan di browser</span></div><div class="form-grid"><div class="field span-2"><label class="label">Foto sampul / pasangan</label><label class="file-drop">＋ Pilih gambar untuk sampul<input type="file" accept="image/*" id="coverUpload"><div class="field-help">Gambar akan diperkecil untuk mengurangi ukuran penyimpanan lokal.</div></label>${m.coverPhoto?`<div style="margin-top:10px"><img src="${m.coverPhoto}" alt="Pratinjau sampul" style="max-width:100%;max-height:180px;border-radius:10px"><button class="btn danger small" style="margin-top:8px" data-action="remove-cover">Hapus foto sampul</button></div>`:''}</div><div class="field span-2"><label class="label">Galeri foto (maksimal 6)</label><label class="file-drop">＋ Tambah gambar galeri<input type="file" accept="image/*" multiple id="galleryUpload"><div class="field-help">Disarankan gambar yang memiliki hak penggunaan. Hindari memuat data sensitif.</div></label>${m.gallery?.length?`<div class="two-col" style="margin-top:10px">${m.gallery.map((src,i)=>`<div><img src="${src}" style="width:100%;height:110px;object-fit:cover;border-radius:9px" alt="Foto galeri ${i+1}"><button class="btn danger small" data-action="remove-gallery" data-index="${i}" style="margin-top:6px">Hapus</button></div>`).join('')}</div>`:''}</div>${inputField('URL musik (opsional)','media.musicUrl',m.musicUrl,'https://.../musik.mp3','url','Gunakan URL audio yang memang boleh digunakan dan dapat diakses langsung.')}</div></section>`;
 if(tab==='content')return `<section class="card editor-card"><div class="card-head"><h3>Salam Pembuka</h3><button class="btn small" data-page="ai">✧ Bantu tulis dengan AI</button></div><div class="form-grid">${textareaField('Kalimat pembuka','copy.opening',cp.opening,'Tulis kata pengantar undangan...','Konten ini akan tampil setelah sampul.')}${textareaField('Kutipan / doa','copy.quote',cp.quote,'Masukkan kutipan atau doa...')}${textareaField('Cerita pasangan','copy.story',cp.story,'Ceritakan perjalanan pasangan...','Bagian ini dapat dinyalakan atau dimatikan pada tab Fitur.')}${textareaField('Ucapan penutup','copy.closing',cp.closing,'Tulis ucapan terima kasih...')}${textareaField('Dress code / informasi khusus','dresscode',p.dresscode,'Informasi opsional untuk tamu...')}</div></section><section class="card editor-card"><div class="card-head"><h3>Hadiah Digital</h3><span class="badge">Opsional</span></div><div class="form-grid">${inputField('Nama bank / dompet digital','gift.bank',p.gift?.bank,'Nama layanan')}${inputField('Nomor rekening / akun','gift.account',p.gift?.account,'Nomor tujuan')}${inputField('Nama penerima','gift.recipient',p.gift?.recipient,'Nama pemilik rekening')}</div><div class="field-help">Pastikan informasi hadiah benar dan memang ingin dipublikasikan.</div></section>`;
 return `<section class="card editor-card"><div class="card-head"><h3>Fitur Undangan</h3><span class="badge">On / Off</span></div><p class="small-text muted">Pilih bagian yang ingin ditampilkan pada undangan final.</p><div class="check-grid">${[['countdown','Hitung mundur'],['maps','Google Maps'],['rsvp','RSVP'],['guestbook','Buku tamu / ucapan'],['music','Musik latar'],['gift','Hadiah digital'],['dresscode','Dress code'],['story','Cerita pasangan'],['gallery','Galeri foto'],['hosts','Turut mengundang']].map(([k,l])=>`<label class="check-card"><input type="checkbox" data-feature="${k}" ${f[k]?'checked':''}> ${l}</label>`).join('')}</div><div class="divider"></div><div class="notice warning"><span>!</span><div>RSVP dan buku tamu memerlukan database/backend agar jawaban tamu tersimpan terpusat. Versi HTML mandiri belum mengirimkan data ke dashboard secara otomatis.</div></div></section>`;
}
function renderMiniPreview(p){const d=p.design||getTemplate(p.templateId).design,c=p.couple||{},e=p.event||{},cp=p.copy||{},m=p.media||{};let style=`--p:${safeColor(d.primary,'#171827')};--s:${safeColor(d.secondary,'#782b47')};--a:${safeColor(d.accent,'#d4af65')};--bg:${safeColor(d.background,'#faf5f0')};--txt:${safeColor(d.text,'#31242a')}`;return `<div class="invite-preview" style="${style}"><div class="preview-cover">${m.coverPhoto?`<img class="preview-image" src="${m.coverPhoto}" alt="Foto pasangan" style="margin-bottom:17px;max-height:155px">`:''}<div class="preview-kicker">THE ${esc(p.eventType||'WEDDING')} OF</div><div class="preview-names">${esc(c.groom||'Nama Pria')}<br><span style="color:var(--a)">&amp;</span><br>${esc(c.bride||'Nama Wanita')}</div><div class="preview-line"></div><p>${esc(e.receptionDate?fmtDate(e.receptionDate):'SAVE THE DATE')}</p><div class="fake-button">Buka Undangan</div></div><div class="preview-section"><div class="preview-kicker" style="color:var(--s)">ASSALAMUALAIKUM</div><h4>${esc(c.groom||'Mempelai')} &amp; ${esc(c.bride||'Mempelai')}</h4><p>${esc(cp.opening||'Kata pengantar undangan.')}</p>${e.receptionDate?`<div class="preview-event"><strong>${esc(fmtDate(e.receptionDate))}</strong><p>${esc(e.receptionTime||'Waktu acara')}<br>${esc(e.receptionVenue||'Lokasi acara')}</p></div>`:''}</div><div class="preview-section" style="background:#fff"><div class="preview-line"></div><h4>Hari Bahagia Kami</h4><p>${esc(cp.closing||'Dengan hormat, kami mengundang Anda.')}</p><div class="preview-kicker" style="color:var(--s)">MAKEN GROUP</div></div></div>`}
function renderGuests(){let list=state.guests.filter(g=>(`${g.name} ${g.group||''} ${g.status||''}`).toLowerCase().includes(guestSearch.toLowerCase()));return `${pageHead('GUEST MANAGEMENT','Manajemen Tamu','Susun daftar tamu, buat tautan personal, serta siapkan daftar untuk dibagikan. Data saat ini tersimpan lokal.',`<button class="btn" data-action="import-guests">⇧ Impor CSV</button><button class="btn primary" data-action="add-guest">＋ Tambah Tamu</button>`)}<div class="stats">${stat('Total Tamu',state.guests.length,'♧','Tamu yang tersimpan')}${stat('Hadir',state.guests.filter(g=>g.status==='Hadir').length,'✓','Status RSVP','#16876b')}${stat('Tidak Hadir',state.guests.filter(g=>g.status==='Tidak hadir').length,'×','Status RSVP','#c2455d')}${stat('Belum Merespons',state.guests.filter(g=>!g.status||g.status==='Belum merespons').length,'…','Belum ada jawaban','#ac7618')}</div><div class="card card-pad"><div class="toolbar"><input class="input" id="guestSearch" placeholder="Cari nama atau kelompok..." value="${esc(guestSearch)}"><button class="btn" data-action="export-guests">⇩ Ekspor CSV</button><button class="btn" data-action="generate-links">Buat tautan personal</button></div>${list.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Nama Tamu</th><th>Kelompok</th><th>Status RSVP</th><th>Tautan / Aksi</th></tr></thead><tbody>${list.map(g=>`<tr><td><div class="guest-name">${esc(g.name)}</div><div class="guest-email">${esc(g.note||'')}</div></td><td>${esc(g.group||'Umum')}</td><td><select class="select" style="min-width:135px;padding:7px" data-guest-status="${g.id}">${['Belum merespons','Hadir','Tidak hadir'].map(x=>`<option ${g.status===x?'selected':''}>${x}</option>`).join('')}</select></td><td><div class="inline-actions"><button class="btn small" data-action="copy-guest-link" data-id="${g.id}">Salin link</button><button class="btn small danger" data-action="delete-guest" data-id="${g.id}">Hapus</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">♧</div><h3>Daftar tamu masih kosong</h3><p>Tambahkan tamu satu per satu atau impor berkas CSV. Link personal dapat dibuat setelah undangan dipilih dan dipublikasikan.</p><button class="btn primary" data-action="add-guest">＋ Tambah Tamu</button></div>`}</div><div class="notice neutral" style="margin-top:16px"><span>ⓘ</span><div>Link personal pada mode statis membawa data undangan yang disematkan di URL, tetapi tidak menyinkronkan RSVP. Untuk RSVP bersama diperlukan backend/database.</div></div>`}
function makePrompt(p,form={}){const c=p?.couple||{},e=p?.event||{},d=p?.design||{};const features=Array.isArray(form.features)?form.features:Object.keys(p?.features||{}).filter(k=>p.features[k]);return `Bertindaklah sebagai Senior Wedding Invitation Creative Director, UI/UX Designer, dan Design Systems Engineer dari Maken Group. Rancang konsep undangan digital baru yang orisinal, elegan, dan dapat diterapkan oleh website Maken Invitation Studio.\n\nBRIEF PROYEK\nJenis acara: ${form.eventType||p?.eventType||'Pernikahan'}\nNama pasangan: ${c.groom||'[Nama pria]'} & ${c.bride||'[Nama wanita]'}\nTema visual: ${form.style||d.style||'Modern Magazine'}\nTema budaya: ${form.culture||'Modern tanpa tema adat'}\nPalet warna: ${form.palette||`${d.primary||'#171827'}, ${d.secondary||'#782b47'}, ${d.accent||'#d4af65'}`}\nSampul: ${form.cover||d.cover||'Amplop interaktif'}\nTingkat desain: ${form.level||'Premium'}\nArah visual/referensi: ${form.reference||'Editorial, proporsi rapi, tekstur halus, hierarki tipografi kuat.'}\nFitur yang diinginkan: ${features.join(', ')||'Sampul, pasangan, acara, penutup'}\nInstruksi tambahan: ${form.custom||'Buat komposisi yang khas dan responsif.'}\n\nDATA YANG HARUS DIPERTAHANKAN\nTanggal akad: ${e.akadDate||'belum ditentukan'}; waktu: ${e.akadTime||'belum ditentukan'}; lokasi: ${e.akadVenue||'belum ditentukan'}\nTanggal resepsi: ${e.receptionDate||'belum ditentukan'}; waktu: ${e.receptionTime||'belum ditentukan'}; lokasi: ${e.receptionVenue||'belum ditentukan'}\n\nKELUARAN WAJIB\nKembalikan JSON valid saja, tanpa markdown fence, menggunakan skema: {"designName":"string","theme":{"primary":"#RRGGBB","secondary":"#RRGGBB","accent":"#RRGGBB","background":"#RRGGBB","text":"#RRGGBB"},"typography":{"heading":"Georgia","body":"Arial","headingAlignment":"center"},"cover":{"layout":"interactive-envelope|editorial-frame|minimal|floral|classic"},"sections":["hero","couple","story","event","countdown","location","gallery","music","rsvp","guestbook","gift","dresscode","hosts","closing"],"features":{"music":true,"countdown":true,"maps":true,"rsvp":true,"gallery":true,"gift":false},"designNotes":["..."],"accessibilityNotes":["..."]}.\nGunakan hanya nilai konfigurasi yang aman dan umum. Jangan mengarang data acara. Jangan keluarkan kode JavaScript/HTML untuk dieksekusi. Utamakan mobile-first, kontras yang cukup, performa, dan konsistensi desain. Data nama dan acara harus tetap dipertahankan.`}
function renderAI(){const p=getProject();const template=p?makePrompt(p):`Bertindak sebagai Senior Wedding Invitation Creative Director dari Maken Group. Buat konsep undangan digital baru yang unik, elegan, mobile-first, dan dapat dirender dari konfigurasi JSON. Jangan mengarang data mempelai atau acara yang belum ada. Kembalikan JSON valid sesuai skema designName, theme, typography, cover, sections, features, designNotes, accessibilityNotes.`;latestPrompt=template;return `${pageHead('MAKEN AI LAB','Dari ide menjadi desain baru.','Rancang konsep menggunakan prompt, bawa hasilnya kembali sebagai JSON, lalu terapkan ke editor dengan kontrol yang aman.',`<button class="btn" data-page="editor">Buka Editor</button>`)}<div class="ai-hero"><div><div class="eyebrow" style="color:#c9bcff">CREATIVE INTELLIGENCE</div><h2>AI Design Lab <span style="color:#e8c2ff">✧</span></h2><p>Eksplorasi arah visual, buat prompt profesional, minta variasi desain di ChatGPT, lalu impor konfigurasi untuk diterapkan pada proyek. Integrasi API otomatis dapat diaktifkan melalui backend yang aman.</p></div><div class="ai-hero-badge">✧</div></div>${!p?`<div class="notice warning" style="margin-bottom:16px"><span>!</span><div>Belum ada proyek aktif. Kamu tetap dapat menyusun prompt, tetapi buat proyek terlebih dahulu untuk mengikat data desain pada undangan.</div></div>`:`<div class="notice neutral" style="margin-bottom:16px"><span>▧</span><div>Proyek aktif: <strong>${esc(p.title)}</strong>. Prompt otomatis menyertakan brief desain dan informasi proyek yang relevan.</div></div>`}<div class="ai-layout"><section class="card card-pad"><div class="card-head"><div><h2>01 · Susun brief desain</h2><div class="small-text muted" style="margin-top:5px">Pilihan ini akan digabungkan menjadi prompt siap pakai.</div></div></div><div class="form-grid"><div class="field"><label class="label">Gaya visual</label><select class="select" id="aiStyle">${['Modern Magazine','Korean Minimalist','Luxury Classic','Floral Romantic','Adat Buol Royal','Pink & Yellow Editorial','Eksperimental / Custom'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label class="label">Tema budaya</label><select class="select" id="aiCulture">${['Modern tanpa tema adat','Adat Buol','Adat Kaili','Adat Bugis','Adat Jawa','Adat Minangkabau','Custom / perlu referensi'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label class="label">Palet warna</label><select class="select" id="aiPalette">${['Hitam, emas, dan marun','Pink dan kuning cerah','Ivory, beige, dan sage','Lavender dan dusty pink','Navy dan champagne gold','Bebas sesuai arahan AI'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label class="label">Konsep sampul</label><select class="select" id="aiCover">${['Amplop interaktif','Editorial foto penuh','Bingkai foto klasik','Minimalis','Ilustrasi floral','Ornamen budaya'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label class="label">Tingkat kompleksitas</label><select class="select" id="aiLevel"><option>Minimal</option><option selected>Premium</option><option>Eksperimental dan kompleks</option></select></div><div class="field"><label class="label">Jenis acara</label><select class="select" id="aiEvent">${['Pernikahan','Pertunangan','Aqiqah atau khitanan','Ulang tahun','Acara keluarga'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field span-2"><label class="label">Fitur yang diminta</label><div class="check-grid">${[['Galeri foto','Galeri foto'],['Musik','Musik'],['Hitung mundur','Hitung mundur'],['Google Maps','Google Maps'],['RSVP','RSVP'],['Buku tamu','Buku tamu'],['Hadiah digital','Hadiah digital'],['QR check-in','QR check-in']].map(([v,l],i)=>`<label class="check-card"><input type="checkbox" class="aiFeature" value="${v}" ${i<5?'checked':''}> ${l}</label>`).join('')}</div></div><div class="field span-2"><label class="label">Referensi / arah visual</label><textarea class="textarea" id="aiReference">Gunakan hierarki tipografi yang jelas, tekstur elegan, foto pasangan sebagai fokus utama, ruang kosong yang cukup, dan komposisi mobile-first.</textarea></div><div class="field span-2"><label class="label">Instruksi khusus</label><textarea class="textarea" id="aiCustom" placeholder="Contoh: panel foto tengah dan bawah harus memiliki ukuran sama; ornamen jangan mengganggu wajah.">Buat desain baru yang berbeda dari template standar. Pertahankan data mempelai dan buat layout yang profesional, unik, serta responsif.</textarea></div></div><div class="divider"></div><div class="inline-actions"><button class="btn primary" data-action="refresh-prompt">✧ Buat Prompt</button><button class="btn" data-action="apply-local-ai">Terapkan preset cepat</button></div><div class="field-help">Preset cepat hanya menerapkan tema lokal. Ini bukan hasil panggilan model AI.</div></section><div class="editor-stack"><section class="card card-pad"><div class="card-head"><div><h2>02 · Prompt untuk ChatGPT</h2><div class="small-text muted" style="margin-top:5px">Salin prompt atau buka ChatGPT untuk menjalankannya.</div></div><span class="badge purple">Prompt Lab</span></div><div class="prompt-box" id="aiPromptOutput">${esc(template)}</div><div class="inline-actions" style="margin-top:13px"><button class="btn primary" data-action="copy-open-chatgpt">Salin & Buka ChatGPT ↗</button><button class="btn" data-action="copy-prompt">Salin saja</button></div><div class="divider"></div><div class="notice warning"><span>!</span><div>Membuka ChatGPT tidak memasukkan prompt secara otomatis. Tempel prompt di percakapan ChatGPT, minta JSON sesuai skema, lalu salin hasilnya ke kotak impor di bawah.</div></div></section><section class="card card-pad"><div class="card-head"><div><h2>03 · Impor hasil AI</h2><div class="small-text muted" style="margin-top:5px">Hanya konfigurasi desain yang diizinkan akan diterapkan.</div></div></div><textarea class="textarea" id="aiJsonImport" style="min-height:170px;font-family:ui-monospace,monospace;font-size:11px" placeholder='Tempel JSON hasil ChatGPT di sini...'></textarea><div class="inline-actions" style="margin-top:12px"><button class="btn primary" data-action="import-ai-json">Validasi & Terapkan JSON</button><button class="btn" data-action="download-ai-prompt">Ekspor Prompt .txt</button></div><div class="field-help">AI tidak boleh mengirim kode mentah untuk dieksekusi. Sistem memvalidasi warna, layout, daftar bagian, dan fitur sebelum menerapkan hasilnya.</div></section></div></div>`}
function renderPublish(){const p=getProject();if(!p)return pageHead('PUBLISH CENTER','Publikasi & Tautan','Buat paket undangan yang dapat dibagikan atau diunggah ke GitHub Pages.','<button class="btn primary" data-action="new-project">＋ Buat Proyek</button>');return `${pageHead('PUBLISH CENTER','Siapkan undangan untuk dibagikan.','Ekspor halaman HTML mandiri dengan aset yang disertakan, atau buat tautan pratinjau ringan untuk pengujian.',`<button class="btn" data-page="editor">← Kembali ke Editor</button>`)}<div class="notice warning" style="margin-bottom:18px"><span>!</span><div><strong>Perlu diketahui:</strong> GitHub Pages tidak otomatis membuat berkas baru dari formulir browser. Unduh HTML mandiri, lalu unggah ke repositori untuk mendapatkan URL publik permanen. Link ringan di bawah membawa data teks dalam URL, tetapi tidak menyertakan foto lokal dan tidak menyimpan RSVP ke database.</div></div><div class="dashboard-grid"><section class="card card-pad"><div class="card-head"><div><h2>Checklist sebelum publikasi</h2><div class="small-text muted" style="margin-top:5px">Proyek aktif: ${esc(p.title)}</div></div>${statusBadge(p.status)}</div>${[['Nama kedua mempelai',!!p.couple?.groom&&!!p.couple?.bride],['Tanggal atau jadwal acara',!!(p.event?.akadDate||p.event?.receptionDate)],['Lokasi acara',!!(p.event?.akadVenue||p.event?.receptionVenue||p.event?.mapsUrl)],['Teks undangan',!!p.copy?.opening],['Palet desain',!!p.design?.primary]].map(([l,ok])=>`<div class="switch-row"><div><strong style="font-size:12px">${l}</strong><div class="small-text muted">${ok?'Sudah terisi':'Perlu diperiksa'}</div></div><span class="badge ${ok?'green':'amber'}">${ok?'✓ Siap':'Periksa'}</span></div>`).join('')}<div class="inline-actions" style="margin-top:18px"><button class="btn primary" data-action="mark-ready">Tandai Siap Diterbitkan</button><button class="btn" data-action="export-json">Ekspor JSON</button></div></section><section class="card card-pad"><div class="card-head"><div><h2>Eks 5px"></textarea><div class="field-help">Link preview ringan tidak menyematkan foto lokal agar URL tetap kecil. Untuk undangan lengkap beserta foto, gunakan ekspor HTML.</div></div></section>`}
function renderAnalytics(){const total=state.guests.length,yes=state.guests.filter(g=>g.status==='Hadir').length,no=state.guests.filter(g=>g.status==='Tidak hadir').length,pending=total-yes-no;return `${pageHead('INSIGHTS','Statistik RSVP','Ringkasan data tamu yang dicatat oleh aplikasi di browser ini. Data ini tidak mencakup jawaban tamu yang belum diimpor.',`<button class="btn" data-page="guests">Kelola Tamu →</button>`)}<div class="stats">${stat('Total Tamu',total,'♧','Tamu dalam daftar')}${stat('Hadir',yes,'✓',total?Math.round(yes/total*100)+'% dari daftar':'Belum ada data','#16876b')}${stat('Tidak Hadir',no,'×',total?Math.round(no/total*100)+'% dari daftar':'Belum ada data','#c2455d')}${stat('Menunggu',pending,'…',total?Math.round(pending/total*100)+'% belum ditandai':'Belum ada data','#ac7618')}</div><div class="dashboard-grid"><section class="card card-pad"><div class="card-head"><h2>Komposisi status</h2><span class="badge">Tamu lokal</span></div>${total?`<div style="height:20px;border-radius:8px;overflow:hidden;display:flex;background:#f1f1f6"><div style="width:${yes/total*100}%;background:#16876b"></div><div style="width:${no/total*100}%;background:#c2455d"></div><div style="width:${pending/total*100}%;background:#d8d9e4"></div></div><div class="switch-row"><span><span style="color:#16876b">●</span> Hadir</span><strong>${yes}</strong></div><div class="switch-row"><span><span style="color:#c2455d">●</span> Tidak hadir</span><strong>${no}</strong></div><div class="switch-row"><span><span style="color:#a4a6b8">●</span> Belum merespons</span><strong>${pending}</strong></div>`:`<div class="empty"><div class="empty-icon">▥</div><h3>Belum ada data RSVP</h3><p>Tambahkan tamu dan tandai respons secara manual, atau rencanakan koneksi backend untuk menerima konfirmasi secara online.</p><button class="btn primary" data-page="guests">Buka Manajemen Tamu</button></div>`}</section><section class="card card-pad"><div class="card-head"><h2>Data & sinkronisasi</h2></div><div class="notice warning"><span>!</span><div>Dashboard ini menampilkan data yang disimpan secara lokal. RSVP dari perangkat pengunjung tidak dapat terkumpul otomatis tanpa layanan backend/database.</div></div><div class="divider"></div><button class="btn full" data-action="export-guests">Ekspor daftar tamu CSV</button><button class="btn full" data-page="settings" style="margin-top:9px">Konfigurasi integrasi</button></section></div>`}

function bindPageEvents(){const root=document.getElementById('pageContent');if(currentPage==='projects'){const q=root.querySelector('#projectSearch');if(q)q.addEventListener('input',()=>{projectSearch=q.value;const old=root.querySelector('.project-list');if(old){let filtered=state.projects.filter(p=>(`${p.title} ${p.couple?.bride} ${p.couple?.groom} ${p.status}`).toLowerCase().includes(projectSearch.toLowerCase()));old.innerHTML=filtered.map(p=>projectRow(p)).join('')||'<div class="empty"><p>Tidak ada proyek yang cocok.</p></div>';}});const sel=root.querySelector('#projectStatusFilter');if(sel)sel.addEventListener('change',()=>{const qv=root.querySelector('#projectSearch')?.value||'';const filtered=state.projects.filter(p=>(`${p.title} ${p.couple?.bride} ${p.couple?.groom}`).toLowerCase().includes(qv.toLowerCase())&&(sel.value==='Semua Status'||p.status===sel.value));root.querySelector('.project-list')?.remove();const card=root.querySelector('.card.card-pad');if(card){if(filtered.length)card.insertAdjacentHTML('beforeend',`<div class="project-list">${filtered.map(p=>projectRow(p)).join('')}</div>`);else card.insertAdjacentHTML('beforeend','<div class="empty"><p>Tidak ada proyek yang cocok.</p></div>')}})}
 if(currentPage==='templates'){const q=root.querySelector('#templateSearch'),cat=root.querySelector('#templateCategory');function fil(){const v=(q?.value||'').toLowerCase(),c=cat?.value||'Semua';root.querySelector('#templateGrid').innerHTML=templates.filter(t=>(`${t.name} ${t.desc} ${t.category} ${t.tags.join(' ')}`).toLowerCase().includes(v)&&(c==='Semua'||t.category===c)).map(templateCard).join('')||'<div class="empty"><p>Template tidak ditemukan.</p></div>'}q?.addEventListener('input',fil);cat?.addEventListener('change',fil)}

async function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Gagal membaca gambar'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('File gambar tidak valid'));img.onload=()=>{const max=1200,ratio=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.readAsDataURL(file)})}

function exportGuestsCSV(){const rows=[['Nama','Kelompok','Status RSVP','Catatan'],...state.guests.map(g=>[g.name,g.group||'',g.status||'Belum merespons',g.note||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadFile('maken-group-daftar-tamu.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
function downloadPrompt(){const p=getProject();const form=getAIForm();downloadFile('maken-ai-design-prompt.txt',makePrompt(p,form),'text/plain;charset=utf-8')}
function applyAIConfig(config){const p=getProject();if(!p)throw new Error('Buat atau pilih proyek sebelum menerapkan hasil AI.');if(!config||typeof config!=='object'||Array.isArray(config))throw new Error('JSON harus berupa sebuah objek.');const d=config.theme||config.design?.theme;if(d){for(const k of ['primary','secondary','accent','background','text'])if(d[k]){if(!/^#[0-9a-fA-F]{6}$/.test(d[k]))throw new Error('Warna '+k+' tidak valid. Gunakan format #RRGGBB.');p.design[k]=d[k]}}const layout=config.cover?.layout;if(layout){const map={'interactive-envelope':'envelope','editorial-frame':'editorial','minimal':'minimal','floral':'floral','classic':'classic','Amplop interaktif':'envelope','Editorial foto penuh':'editorial','Bingkai foto klasik':'classic','Minimalis':'minimal','Ilustrasi floral':'floral'};if(map[layout])p.design.cover=map[layout]}if(config.designName)p.design.style=String(config.designName).slice(0,100);if(config.typography){const fonts=['Georgia','Palatino Linotype','Times New Roman','Arial','Trebuchet MS','Verdana','Tahoma'];if(fonts.includes(config.typography.heading))p.design.headingFont=config.typography.heading;if(fonts.includes(config.typography.body))p.design.bodyFont=config.typography.body}if(Array.isArray(config.sections)){p.features.sections= config.sections.filter(x=>allowedSections.includes(x));for(const k of ['story','gallery','countdown','maps','rsvp','guestbook','music','gift','dresscode','hosts'])if(config.sections.includes(k))p.features[k]=true}if(config.features&&typeof config.features==='object'){for(const k of ['music','countdown','maps','rsvp','gallery','gift','guestbook','dresscode','story','hosts'])if(typeof config.features[k]==='boolean')p.features[k]=config.features[k]}p.updatedAt=dateNow();saveState();return p}
async function runAIEndpoint(){const p=getProject();if(!p)throw new Error('Buat atau pilih proyek terlebih dahulu.');const endpoint=String(state.settings.aiEndpoint||'').trim();if(!endpoint){toast('Endpoint AI belum dikonfigurasi. Salin prompt ke ChatGPT, lalu impor JSON hasilnya.','error');return}const u=safeUrl(endpoint);if(!u)throw new Error('URL endpoint harus berupa URL HTTP(S) yang valid.');const prompt=makePrompt(p,getAIForm());toast('Mengirim brief ke backend AI…');try{const response=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:'design',prompt,project:publicPayload(p)})});if(!response.ok)throw new Error('Backend mengembalikan HTTP '+response.status);const result=await response.json();const config=result.design||result.result||result;applyAIConfig(config);toast('Konfigurasi AI berhasil diterapkan.','success');setPage('editor')}catch(e){throw new Error('Panggilan AI gagal: '+e.message+' Pastikan endpoint, autentikasi, dan CORS telah dikonfigurasi.') }}
function addGuest(){const name=prompt('Nama tamu:');if(!name||!name.trim())return;const group=prompt('Kelompok tamu (opsional):','Umum')||'Umum';state.guests.push({id:uid(),name:name.trim(),group:group.trim(),status:'Belum merespons',note:''});saveState();renderPage();toast('Tamu ditambahkan.','success')}
function projectActionMenu(id){const p=getProject(id);if(!p)return;const pick=prompt(`Aksi proyek: ${p.title}\nKetik: duplicate / export / delete / archive`,'duplicate');if(!pick)return;if(pick==='duplicate'){const copy=JSON.parse(JSON.stringify(p));copy.id=uid();copy.title=p.title+' (Salinan)';copy.slug=slugify(p.slug+'-salinan');copy.status='Draf';copy.createdAt=copy.updatedAt=dateNow();state.projects.unshift(copy);state.currentProjectId=copy.id;saveState();renderPage();toast('Proyek berhasil diduplikasi.','success')}else if(pick==='export'){state.currentProjectId=id;exportProjectJSON()}else if(pick==='delete'){if(confirm('Hapus proyek ini secara permanen dari browser?')){state.projects=state.projects.filter(x=>x.id!==id);if(state.currentProjectId===id)state.currentProjectId=state.projects[0]?.id||null;saveState();renderPage();toast('Proyek dihapus.')}}else if(pick==='archive'){p.status='Diarsipkan';p.updatedAt=dateNow();saveState();renderPage()}}
function importBackup(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(reader.result);const incoming=raw.state||raw;if(!Array.isArray(incoming.projects))throw new Error('Format cadangan tidak dikenali.');if(!confirm('Impor akan mengganti data lokal saat ini. Lanjutkan?'))return;state={...structuredClone(defaultState),...incoming,settings:{...defaultState.settings,...(incoming.settings||{})}};saveState();toast('Cadangan berhasil diimpor.','success');renderPage()}catch(err){toast('Gagal impor: '+err.message,'error')}};reader.readAsText(file)}
function generateLinkForPublish(){const p=getProject();if(!p)return;const name=document.getElementById('publishGuestName')?.value||'';const base=document.getElementById('publishBaseUrl')?.value||location.href.split('#')[0];try{const link=makeGuestLink(p,name,base);const out=document.getElementById('publishLinkOutput');if(out)out.value=link;toast('Tautan preview dibuat. Uji setelah website diterbitkan.','success')}catch(e){toast(e.message,'error')}}
function action(action,id,el){const p=getProject();switch(action){case'new-project':{const t=state.settings.defaultStyle;const found=templates.find(x=>x.name===t);newProject(found?.id||'magazine');currentEditorTab='data';setPage('editor');toast('Proyek baru dibuat.','success');break}case'edit-project':state.currentProjectId=id;currentEditorTab='data';setPage('editor');break;case'project-menu':projectActionMenu(id);break;case'use-template':{const pr=newProject(id);currentEditorTab='data';setPage('editor');toast('Template '+getTemplate(id).name+' siap dikustomisasi.','success');break}case'backup':exportBackup();break;case'save-project':if(p){p.updatedAt=dateNow();saveState();markSaved();toast('Perubahan disimpan di browser.','success')}break;case'apply-palette':if(p){p.templateId=id;p.design={...getTemplate(id).design};p.updatedAt=dateNow();saveState();renderPage();toast('Palet diterapkan.','success')}break;case'remove-cover':if(p){p.media.coverPhoto='';saveState();renderPage()}break;case'remove-gallery':if(p){p.media.gallery.splice(Number(el.dataset.index),1);saveState();renderPage()}break;case'add-host':if(p){const hosts=normalizeHosts(p);hosts.push('');p.updatedAt=dateNow();saveState();currentEditorTab='data';renderPage();const fields=document.querySelectorAll('[data-host-index]');fields[fields.length-1]?.focus();toast('Kolom Turut Mengundang ditambahkan.','success')}break;case'remove-host':if(p){const hosts=normalizeHosts(p);const index=Number(id);if(!Number.isInteger(index)||index<0||index>=hosts.length)break;if(hosts.length===1)hosts[0]='';else hosts.splice(index,1);p.updatedAt=dateNow();saveState();currentEditorTab='data';renderPage();toast('Kolom Turut Mengundang diperbarui.','success')}break;case'refresh-preview':refreshMiniPreview();toast('Pratinjau diperbarui.');break;case'preview-full':if(p){const html=buildStandalone(p);const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}break;case'export-html':if(p){downloadFile(`${slugify(p.slug||p.title)}.html`,buildStandalone(p),'text/html;charset=utf-8');toast('HTML undangan siap diunduh.','success')}break;case'export-json':exportProjectJSON();break;case'refresh-prompt':updatePrompt();toast('Prompt diperbarui sesuai brief.','success');break;case'copy-prompt':copyText(document.getElementById('aiPromptOutput')?.textContent||latestPrompt);break;case'copy-open-chatgpt':{const promptText=document.getElementById('aiPromptOutput')?.textContent||latestPrompt;copyText(promptText);window.open('https://chatgpt.com/','_blank','noopener');toast('Prompt disalin. Tempelkan di percakapan ChatGPT yang baru dibuka.','success');break}case'download-ai-prompt':downloadPrompt();break;case'import-ai-json':{try{const value=document.getElementById('aiJsonImport').value;const config=JSON.parse(value);applyAIConfig(config);toast('JSON divalidasi dan diterapkan ke proyek.','success');setPage('editor')}catch(e){toast('JSON tidak dapat diterapkan: '+e.message,'error')}break}case'apply-local-ai':{if(!p){toast('Buat proyek terlebih dahulu.','error');break}const form=getAIForm();const match=templates.find(t=>t.name===form.style)||templates.find(t=>t.id==='magazine');if(match)p.design={...match.design};const palettes={'Hitam, emas, dan marun':['#17151a','#702b3a','#d4af65','#f7f1e9','#292328'],'Pink dan kuning cerah':['#df7398','#f2c94c','#f2c94c','#fff5de','#51364c'],'Ivory, beige, dan sage':['#7a8978','#b7c3ac','#b59d7b','#f8f3e9','#343a32'],'Lavender dan dusty pink':['#74658f','#d2a6b7','#bda7db','#fff8fb','#413747'],'Navy dan champagne gold':['#202b46','#536584','#d8bd85','#f8f4ec','#2c3140']};const pal=palettes[form.palette];if(pal){[p.design.primary,p.design.secondary,p.design.accent,p.design.background,p.design.text]=pal}p.design.style=form.style;p.updatedAt=dateNow();saveState();toast('Preset lokal diterapkan. Ini bukan panggilan AI.','success');setPage('editor');break}case'mark-ready':if(p){const issues=[];if(!p.couple?.groom||!p.couple?.bride)issues.push('nama mempelai');if(!p.event?.akadDate&&!p.event?.receptionDate)issues.push('tanggal acara');if(issues.length){toast('Periksa: '+issues.join(', ')+'.', 'error')}else{p.status='Siap Diterbitkan';p.updatedAt=dateNow();saveState();renderPage();toast('Status proyek diperbarui.','success')}}break;case'make-guest-link':generateLinkForPublish();break;case'copy-guest-link':{const link=document.getElementById('publishLinkOutput')?.value;if(link)copyText(link);else if(id){const g=state.guests.find(x=>x.id===id);if(!g)return;const pr=getProject();if(!pr)return toast('Pilih proyek terlebih dahulu di Publikasi.','error');try{copyText(makeGuestLink(pr,g.name))}catch(e){toast(e.message,'error')}}else toast('Buat tautan terlebih dahulu.','error');break}case'add-guest':addGuest();break;case'delete-guest':if(confirm('Hapus tamu ini?')){state.guests=state.guests.filter(g=>g.id!==id);saveState();renderPage()}break;case'export-guests':exportGuestsCSV();break;case'import-guests':{const pick=document.createElement('input');pick.type='file';pick.accept='.csv,text/csv';pick.onchange=()=>{const f=pick.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const lines=String(r.result).split(/\r?\n/).filter(Boolean).slice(1);let count=0;for(const line of lines){const cols=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));if(cols[0]){state.guests.push({id:uid(),name:cols[0],group:cols[1]||'Umum',status:'Belum merespons',note:cols[2]||''});count++}}saveState();renderPage();toast(count+' tamu berhasil diimpor (CSV sederhana).','success')};r.readAsText(f)};pick.click();break}case'generate-links':setPage('publish');toast('Pilih nama tamu pada Publikasi untuk membuat tautan personal.');break;case'save-settings':saveState();toast('Pengaturan disimpan.','success');break;case'test-ai-endpoint':runAIEndpoint().catch(e=>toast(e.message,'error'));break;case'clear-local-data':if(confirm('Hapus semua data proyek, tamu, dan pengaturan lokal? Unduh cadangan dahulu jika diperlukan.')){localStorage.removeItem(STORAGE_KEY);state=structuredClone(defaultState);toast('Data lokal dihapus.','success');renderPage()}break;default:break}}
function bindGlobal(){document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){e.preventDefault();if(nav.dataset.page==='editor'&&!getProject()&&nav.dataset.page==='editor'){newProject();currentEditorTab='data'}setPage(nav.dataset.page);return}const act=e.target.closest('[data-action]');if(act){e.preventDefault();action(act.dataset.action,act.dataset.id,act);return}const tab=e.target.closest('[data-editor-tab]');if(tab){currentEditorTab=tab.dataset.editorTab;renderPage();return}});document.getElementById('mainNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});document.getElementById('menuToggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('mobileOverlay').classList.add('show')});document.getElementById('mobileOverlay').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileOverlay').classList.remove('show')});document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){projectSearch=e.target.value;setPage('projects');const q=document.getElementById('projectSearch');if(q){q.value=projectSearch;q.dispatchEvent(new Event('input'))}}});window.addEventListener('beforeunload',()=>{try{saveState()}catch(e){}})}
function init(){const hash=location.hash;if(hash.startsWith('#invite=')){try{const parts=hash.slice(8).split('&to=');const payload=decodeB64(parts[0]);const name=parts.length>1?decodeURIComponent(parts.slice(1).join('&to='))||'':'';renderGuestRoute(payload,name);return}catch(e){document.getElementById('pageContent').innerHTML='<div class="empty"><h3>Tautan undangan tidak valid</h3><p>Data pada tautan mungkin terpotong atau tidak dapat dibaca.</p><a class="btn" href="'+location.href.split('#')[0]+'">Buka Maken Invitation Studio</a></div>'}}bindGlobal();renderPage()}
init();
})();
</script>
